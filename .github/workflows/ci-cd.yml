name: MiniCriollos CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Quality and build checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check backend JavaScript syntax
        run: |
          node --check services/inventory-service/index.js
          node --check services/inventory-service/db.js
          node --check services/sales-service/index.js
          node --check services/sales-service/db.js
          node --check services/reports-service/index.js
          node --check services/reports-service/db.js

  container-build:
    name: Build Docker images
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: frontend
          - name: inventory
            context: services/inventory-service
          - name: sales
            context: services/sales-service
          - name: reports
            context: services/reports-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false

  publish-images:
    name: Publish Docker images to GHCR
    needs: [checks, container-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image owner
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Publish inventory service
        uses: docker/build-push-action@v6
        with:
          context: services/inventory-service
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/minicriollos-inventory:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/minicriollos-inventory:latest
      - name: Publish sales service
        uses: docker/build-push-action@v6
        with:
          context: services/sales-service
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/minicriollos-sales:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/minicriollos-sales:latest
      - name: Publish reports service
        uses: docker/build-push-action@v6
        with:
          context: services/reports-service
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/minicriollos-reports:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/minicriollos-reports:latest
      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/minicriollos-frontend:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/minicriollos-frontend:latest
